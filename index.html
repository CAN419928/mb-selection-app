<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>M-B 選出アシスタント</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f4f7fb;color:#172033}
.wrap{max-width:680px;margin:auto;padding:18px 14px 40px}.card{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #00000010}
h1{font-size:22px;margin:0 0 5px}.sub{font-size:13px;color:#667085;margin-bottom:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.tab{border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;background:#e8edf5}.tab.active{background:#172033;color:white}
input{width:100%;padding:14px;border:2px solid #d8dee9;border-radius:12px;font-size:16px;outline:none}input:focus{border-color:#7b8cff}
.label{font-size:12px;color:#667085;margin:0 0 7px;font-weight:700}
.candidates{margin-top:8px;display:grid;gap:7px}.candidate{width:100%;text-align:left;background:#fff;border:1px solid #d8dee9;border-radius:12px;padding:13px;font-size:16px;font-weight:700}
.candidate:active{background:#eaf0ff;transform:scale(.99)}.candidate small{font-weight:400;color:#7a8494;margin-left:7px}
.selected{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.pill{display:flex;align-items:center;gap:7px;background:#edf2ff;border-radius:999px;padding:8px 10px 8px 12px;font-size:14px;font-weight:700}.pill button{border:0;background:transparent;font-size:17px;padding:0;line-height:1}
.status{margin-top:10px;font-size:13px;color:#667085}.empty{color:#98a2b3;font-size:13px;padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>⚔️ M-B 選出アシスタント</h1>
<div class="sub">まずは「タップでポケモンを登録」だけを確実に動かす版</div>
<div class="tabs">
<button id="mineTab" class="tab active">自分の6匹</button>
<button id="oppTab" class="tab">相手の6匹</button>
</div>
<div class="label">ポケモンを検索</div>
<input id="search" type="text" autocomplete="off" placeholder="例：ガブ / ミミ / Garchomp">
<div id="candidates" class="candidates"></div>
<div id="selected" class="selected"></div>
<div id="status" class="status"></div><div id="detail" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid #e1e6ef">
<h2 id="detailTitle" style="font-size:18px;margin:0 0 10px">個体登録</h2>
<div style="padding:14px;background:#f7f9fc;border-radius:12px;font-size:14px">ここに個体登録画面を追加していきます。</div>
<button id="detailClose" style="margin-top:10px;width:100%;padding:12px;border:1px solid #d8dee9;border-radius:11px;background:#fff;font-weight:700">戻る</button>
</div>
</div>
</div>
<script>
(function(){
"use strict";
const P=[
["garchomp","ガブリアス","Garchomp","がぶりあす"],["primarina","アシレーヌ","Primarina","あしれーぬ"],["archaludon","ブリジュラス","Archaludon","ぶりじゅらす"],["meowscarada","マスカーニャ","Meowscarada","ますかーにゃ"],["mimikyu","ミミッキュ","Mimikyu","みみっきゅ"],["dragonite","カイリュー","Dragonite","かいりゅー"],["gengar","ゲンガー","Gengar","げんがー"],["annihilape","コノヨザル","Annihilape","このよざる"],["kingambit","ドドゲザン","Kingambit","どどげざん"],["ceruledge","ソウブレイズ","Ceruledge","そうぶれいず"],["azumarill","マリルリ","Azumarill","まりるり"],["greninja","ゲッコウガ","Greninja","げっこうが"],["rotom-wash","ウォッシュロトム","Rotom-Wash","うぉっしゅろとむ"],["gouging-fire","ウガツホムラ","Gouging Fire","うがつほむら"],["iron-valiant","テツノブジン","Iron Valiant","てつのぶじん"],["great-tusk","イダイナキバ","Great Tusk","いだいなきば"],["salamence","ボーマンダ","Salamence","ぼーまんだ"],["volcarona","ウルガモス","Volcarona","うるがもす"],["scizor","ハッサム","Scizor","はっさむ"],["glimmora","キラフロル","Glimmora","きらふろる"]
];
let mode="mine",chosen={mine:[],opp:[]};
const $=id=>document.getElementById(id);
function hira(v){return v.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).toLowerCase()}
function render(){
 const q=hira($("search").value.trim()),arr=chosen[mode];
 const matches=P.filter(x=>!arr.includes(x[0]) && (!q||[x[1],x[2],x[3]].some(v=>hira(v).includes(q))));
 $("candidates").innerHTML=matches.slice(0,10).map(x=>'<button class="candidate" data-id="'+x[0]+'">＋ '+x[1]+'<small>'+x[2]+'</small></button>').join("");
 $("candidates").querySelectorAll(".candidate").forEach(btn=>btn.addEventListener("click",function(){
   if(arr.length>=6)return; arr.push(this.dataset.id); $("search").value=""; render();
 }));
 $("selected").innerHTML=arr.length?arr.map((id,i)=>{const x=P.find(v=>v[0]===id);return '<button class="mon-card" data-id="'+id+'"><span class="name">'+x[1]+'</span><span class="edit">'+(mode==="mine"?"タップして個体登録 ›":"登録済み")+'</span></button>'}).join(""):'<div class="empty">候補をタップするとここに登録されます</div>';
 $("selected").querySelectorAll(".mon-card").forEach(btn=>btn.addEventListener("click",function(){
   if(mode!=="mine")return;
   $("detailTitle").textContent="🧬 "+P.find(x=>x[0]===this.dataset.id)[1]+" の個体登録";
   $("detail").style.display="block"; $("detail").scrollIntoView({behavior:"smooth",block:"center"});
 }));
 $("status").textContent=(mode==="mine"?"自分":"相手")+"： "+arr.length+" / 6 匹";
}
$("mineTab").addEventListener("click",function(){mode="mine";this.classList.add("active");$("oppTab").classList.remove("active");$("detail").style.display="none";render()});
$("oppTab").addEventListener("click",function(){mode="opp";this.classList.add("active");$("mineTab").classList.remove("active");$("detail").style.display="none";render()});
$("search").addEventListener("input",render);
$("detailClose").addEventListener("click",function(){$("detail").style.display="none"});
render();
})();
</script>
</body>
</html>
