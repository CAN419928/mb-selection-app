<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>M-B 選出アシスタント</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f4f7fb;color:#172033}
.wrap{max-width:680px;margin:auto;padding:18px 14px 40px}.card{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #00000010}
h1{font-size:22px;margin:0 0 5px}.sub{font-size:13px;color:#667085;margin-bottom:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.tab{border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;background:#e8edf5}.tab.active{background:#172033;color:white}
input{width:100%;padding:14px;border:2px solid #d8dee9;border-radius:12px;font-size:16px;outline:none}input:focus{border-color:#7b8cff}
.label{font-size:12px;color:#667085;margin:0 0 7px;font-weight:700}
.candidates{margin-top:8px;display:grid;gap:7px}.candidate{width:100%;text-align:left;background:#fff;border:1px solid #d8dee9;border-radius:12px;padding:13px;font-size:16px;font-weight:700}
.candidate:active{background:#eaf0ff;transform:scale(.99)}.candidate small{font-weight:400;color:#7a8494;margin-left:7px}
.selected{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.pill{display:flex;align-items:center;gap:7px;background:#edf2ff;border-radius:999px;padding:8px 10px 8px 12px;font-size:14px;font-weight:700}.pill button{border:0;background:transparent;font-size:17px;padding:0;line-height:1}
.status{margin-top:10px;font-size:13px;color:#667085}.empty{color:#98a2b3;font-size:13px;padding:8px 0}
</style>

<style id="move-ui-enhancement">
.move-slot{margin-top:12px}
.move-slot:first-child{margin-top:0}
.move-slot .move-label{font-size:13px;font-weight:700;margin-bottom:6px}
.move-slot .move-search{width:100%;padding:12px;border:1px solid #d8dee9;border-radius:11px;font-size:16px;box-sizing:border-box}
.move-slot .move-candidates{display:none;gap:6px;margin-top:7px}
.move-slot:focus-within .move-candidates{display:grid}
.move-slot .move-selected{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;padding:10px 12px;border:2px solid #4b8cff;border-radius:10px;background:#eef5ff;color:#174ea6;font-weight:700}
.move-slot .move-selected.empty{border:1px dashed #c8d0dc;background:#f8fafc;color:#7a8797;font-weight:400}
.move-slot .move-change{border:0;background:transparent;color:#174ea6;font-size:12px;font-weight:700;padding:2px 4px}
.move-slot .candidate{padding:9px 10px;border:1px solid #d8dee9;border-radius:9px;background:#fff;text-align:left}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>⚔️ M-B 選出アシスタント</h1>
<div class="sub">まずは「タップでポケモンを登録」だけを確実に動かす版</div>
<div class="tabs">
<button id="mineTab" class="tab active">自分の6匹</button>
<button id="oppTab" class="tab">相手の6匹</button>
</div>
<div class="label">ポケモンを検索</div>
<input id="search" type="text" autocomplete="off" placeholder="例：ガブ / ミミ / Garchomp">
<div id="candidates" class="candidates"></div>
<div id="selected" class="selected"></div>
<div id="status" class="status"></div><div id="detail" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid #e1e6ef">
<h2 id="detailTitle" style="font-size:18px;margin:0 0 12px">個体登録</h2>
<div style="font-size:13px;font-weight:700;margin-bottom:6px">性格</div>
<select id="nature" style="width:100%;padding:12px;border:1px solid #d8dee9;border-radius:11px;background:#fff;font-size:16px">
<option value="">選択してください</option>
<option>いじっぱり</option>
<option>ようき</option>
<option>ひかえめ</option>
<option>おくびょう</option>
<option>ずぶとい</option>
<option>わんぱく</option>
<option>のうてんき</option>
<option>うっかりや</option>
<option>おだやか</option>
<option>しんちょう</option>
<option>なまいき</option>
<option>せっかち</option>
<option>むじゃき</option>
<option>ゆうかん</option>
<option>のんき</option>
<option>れいせい</option>
<option>まじめ</option>
</select>
<div style="font-size:13px;font-weight:700;margin:14px 0 6px">特性</div>
<select id="ability" style="width:100%;padding:12px;border:1px solid #d8dee9;border-radius:11px;background:#fff;font-size:16px">
<option value="">選択してください</option>
</select>
<div style="font-size:13px;font-weight:700;margin:14px 0 6px">メガ進化</div>
<label style="display:flex;align-items:center;justify-content:space-between;padding:12px;background:#f7f9fc;border-radius:11px;border:1px solid #d8dee9">
<span>このポケモンはメガ進化する</span>
<input id="mega" type="checkbox" style="width:22px;height:22px">
</label>
<div style="font-size:13px;font-weight:700;margin:14px 0 6px">持ち物</div>
<input id="itemSearch" type="text" placeholder="持ち物を検索…" autocomplete="off" style="width:100%;padding:12px;border:1px solid #d8dee9;border-radius:11px;font-size:16px">
<div id="itemCandidates" style="display:grid;gap:6px;margin-top:7px"></div>
<div id="itemSelected" style="font-size:13px;margin-top:7px;color:#536174"></div>
<div id="movesArea"></div>
<button id="natureSave" style="margin-top:10px;width:100%;padding:12px;border:0;border-radius:11px;background:#172033;color:#fff;font-weight:700">保存</button>
<button id="detailClose" style="margin-top:10px;width:100%;padding:12px;border:1px solid #d8dee9;border-radius:11px;background:#fff;font-weight:700">戻る</button>
</div>
</div>
</div>
<script>
(function(){
"use strict";
const P=[
["garchomp","ガブリアス","Garchomp","がぶりあす"],["primarina","アシレーヌ","Primarina","あしれーぬ"],["archaludon","ブリジュラス","Archaludon","ぶりじゅらす"],["meowscarada","マスカーニャ","Meowscarada","ますかーにゃ"],["mimikyu","ミミッキュ","Mimikyu","みみっきゅ"],["dragonite","カイリュー","Dragonite","かいりゅー"],["gengar","ゲンガー","Gengar","げんがー"],["annihilape","コノヨザル","Annihilape","このよざる"],["kingambit","ドドゲザン","Kingambit","どどげざん"],["ceruledge","ソウブレイズ","Ceruledge","そうぶれいず"],["azumarill","マリルリ","Azumarill","まりるり"],["greninja","ゲッコウガ","Greninja","げっこうが"],["rotom-wash","ウォッシュロトム","Rotom-Wash","うぉっしゅろとむ"],["gouging-fire","ウガツホムラ","Gouging Fire","うがつほむら"],["iron-valiant","テツノブジン","Iron Valiant","てつのぶじん"],["great-tusk","イダイナキバ","Great Tusk","いだいなきば"],["salamence","ボーマンダ","Salamence","ぼーまんだ"],["volcarona","ウルガモス","Volcarona","うるがもす"],["scizor","ハッサム","Scizor","はっさむ"],["glimmora","キラフロル","Glimmora","きらふろる"]
];
let mode="mine",chosen={mine:[],opp:[]},natures={},abilitiesSaved={},megaSaved={},itemsSaved={},movesSaved={};
const MOVESETS={garchomp:[["つばめがえし",""],["かみつく",""],["のしかかり",""],["ワイドブレイカー",""],["かわらわり",""],["ぶんまわす",""],["じならし",""],["かみくだく",""],["あなをほる",""],["すてみタックル",""],["りゅうせいぐん",""],["ドラゴンエール",""],["ドラゴンクロー",""],["りゅうのはどう",""],["ドラゴンダイブ",""],["ドラゴンテール",""],["だいちのちから",""],["こらえる",""],["からげんき",""],["だいもんじ",""],["ほのおのキバ",""],["かえんほうしゃ",""],["なげつける",""],["ギガインパクト",""],["てだすけ",""],["はかいこうせん",""],["アイアンヘッド",""],["アイアンテール",""],["アクアブレイク",""],["マッドショット",""],["げきりん",""],["どくづき",""],["パワージェム",""],["まもる",""],["あまごい",""],["ねむる",""],["いわなだれ",""],["がんせきふうじ",""],["りんしょう",""],["すなじごく",""],["すなあらし",""],["スケイルショット",""],["こわいかお",""],["ねっさのだいち",""],["シャドークロー",""],["ねごと",""],["いびき",""],["まきびし",""],["ステルスロック",""],["じだんだ",""],["ストーンエッジ",""],["みがわり",""],["にほんばれ",""],["なみのり",""],["つるぎのまい",""],["あばれる",""],["かみなりのキバ",""],["じしん",""],["たきのぼり",""]],primarina:[["ハイドロポンプ",""],["ムーンフォース",""],["れいとうビーム",""],["まもる",""]]};
const ITEMS=["きあいのタスキ","こだわりハチマキ","こだわりメガネ","こだわりスカーフ","いのちのたま","たべのこし","オボンのみ","ラムのみ","ゴツゴツメット","とつげきチョッキ","きあいのハチマキ","じゃくてんほけん","ふうせん","だっしゅつボタン","だっしゅつパック","しんかのきせき","くろいヘドロ","ひかりのねんど","あつぞこブーツ","パンチグローブ","ものまねハーブ","おんみつマント","からぶりほけん","クリアチャーム","メンタルハーブ","パワフルハーブ","ぼうじんゴーグル","するどいツメ","ピントレンズ","たつじんのおび"];
const AB={
garchomp:["すながくれ","さめはだ"],primarina:["げきりゅう"],archaludon:["じきゅうりょく","すじがねいり"],
meowscarada:["しんりょく","へんげんじざい"],mimikyu:["ばけのかわ"],dragonite:["せいしんりょく","マルチスケイル"],
gengar:["のろわれボディ"],annihilape:["やるき","せいしんりょく","まけんき"],kingambit:["まけんき","そうだいしょう"],
ceruledge:["もらいび","くだけるよろい"],azumarill:["あついしぼう","ちからもち","そうしょく"],greninja:["げきりゅう","へんげんじざい"],
"rotom-wash":["ふゆう"],"gouging-fire":["こだいかっせい"],"iron-valiant":["クォークチャージ"],
"great-tusk":["ようりょくそ","こだいかっせい"],salamence:["いかく","じしんかじょう","じょうききかん"],
volcarona:["ほのおのからだ","むしのしらせ"],scizor:["テクニシャン","むしのしらせ","ライトメタル"],glimmora:["どくげしょう","ふしょく"]
};
const $=id=>document.getElementById(id);
function hira(v){return v.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).toLowerCase()}
function render(){
 const q=hira($("search").value.trim()),arr=chosen[mode];
 const matches=P.filter(x=>!arr.includes(x[0]) && (!q||[x[1],x[2],x[3]].some(v=>hira(v).includes(q))));
 $("candidates").innerHTML=matches.slice(0,10).map(x=>'<button class="candidate" data-id="'+x[0]+'">＋ '+x[1]+'<small>'+x[2]+'</small></button>').join("");
 $("candidates").querySelectorAll(".candidate").forEach(btn=>btn.addEventListener("click",function(){
   if(arr.length>=6)return; arr.push(this.dataset.id); $("search").value=""; render();
 }));
 $("selected").innerHTML=arr.length?arr.map((id,i)=>{const x=P.find(v=>v[0]===id);return '<button class="mon-card" data-id="'+id+'"><span class="name">'+x[1]+(natures[id]?" ✓":"")+'</span><span class="edit">'+(mode==="mine"?"タップして個体登録 ›":"登録済み")+'</span></button>'}).join(""):'<div class="empty">候補をタップするとここに登録されます</div>';
 $("selected").querySelectorAll(".mon-card").forEach(btn=>btn.addEventListener("click",function(){
   if(mode!=="mine")return;
   const id=this.dataset.id;
   $("detailTitle").textContent="🧬 "+P.find(x=>x[0]===id)[1]+" の個体登録";
   $("nature").value=natures[id]||"";
   $("nature").dataset.id=id;
   const opts=AB[id]||[];
   $("ability").innerHTML='<option value="">選択してください</option>'+opts.map(v=>'<option>'+v+'</option>').join('');
   $("ability").value=abilitiesSaved[id]||"";
   $("mega").checked=!!megaSaved[id];
   updateItemLock();
   $("itemSearch").value="";
   $("itemSearch").dataset.id=id;
   $("itemSelected").textContent=itemsSaved[id]?"選択中："+itemsSaved[id]:"";
   window.currentPokemonId=id;
   renderItems();
   renderGarchompMoves();
   $("detail").style.display="block"; $("detail").scrollIntoView({behavior:"smooth",block:"center"});
 }));
 $("status").textContent=(mode==="mine"?"自分":"相手")+"： "+arr.length+" / 6 匹";
}
$("mineTab").addEventListener("click",function(){mode="mine";this.classList.add("active");$("oppTab").classList.remove("active");$("detail").style.display="none";render()});
$("oppTab").addEventListener("click",function(){mode="opp";this.classList.add("active");$("mineTab").classList.remove("active");$("detail").style.display="none";render()});
$("search").addEventListener("input",render);
$("natureSave").addEventListener("click",function(){
   const id=$("nature").dataset.id, value=$("nature").value;
   if(!id || !value){alert("性格を選択してください");return}
   natures[id]=value;
   abilitiesSaved[id]=$("ability").value;
   megaSaved[id]=$("mega").checked;
   if(megaSaved[id]) itemsSaved[id]="";
   $("detail").style.display="none";
   render();
   alert("性格を保存しました！");
});
$("detailClose").addEventListener("click",function(){$("detail").style.display="none"});
function updateItemLock(){
 const locked=$("mega").checked;
 $("itemSearch").disabled=locked;
 $("itemSearch").style.background=locked?"#e5e7eb":"#fff";
 $("itemSearch").style.color=locked?"#9ca3af":"#111827";
 $("itemCandidates").style.opacity=locked?"0.45":"1";
 $("itemCandidates").style.pointerEvents=locked?"none":"auto";
 $("itemSelected").style.color=locked?"#9ca3af":"#536174";
 if(locked){
   $("itemSearch").value="";
   $("itemCandidates").innerHTML="";
   $("itemSelected").textContent="メガ進化するため、持ち物は使用できません";
 }
}
function renderGarchompMoves(){
 const id=window.currentPokemonId;
 const list=MOVESETS[id]||[];
 const area=$("movesArea"); if(!area)return;
 area.innerHTML="";
 for(let slot=1;slot<=4;slot++){
  const box=document.createElement("div");
  box.className="move-slot";
  box.innerHTML='<div class="move-label">技'+slot+'</div>'+
   '<input id="move'+slot+'Search" class="move-search" type="text" placeholder="技を検索…" autocomplete="off">'+
   '<div id="move'+slot+'Candidates" class="move-candidates"></div>'+
   '<div id="move'+slot+'Selected" class="move-selected empty">未選択</div>';
  area.appendChild(box);
  const input=box.querySelector("input");
  input.dataset.id=id;
  input.addEventListener("input",()=>renderMoveSlot(slot));
 }
 for(let slot=1;slot<=4;slot++)renderMoveSlot(slot);
}
function renderMoveSlot(slot){
 const input=$("move"+slot+"Search"); if(!input)return;
 const id=input.dataset.id, list=MOVESETS[id]||[], q=hira(input.value.trim());
 const saved=(movesSaved[id]&&Array.isArray(movesSaved[id]))?movesSaved[id]:[];
 const selected=saved[slot-1]||"";
 const found=list.filter(v=>!q||hira(v[0]).includes(q)||hira(v[1]).includes(q));
 const c=$("move"+slot+"Candidates");
 c.innerHTML=found.map(v=>'<button type="button" class="candidate" data-move="'+v[0]+'">'+v[0]+'</button>').join("");
 c.querySelectorAll("[data-move]").forEach(b=>b.addEventListener("click",function(){
  if(!movesSaved[id]||!Array.isArray(movesSaved[id]))movesSaved[id]=[];
  movesSaved[id][slot-1]=this.dataset.move;
  input.value="";
  renderMoveSlot(slot);
  input.blur();
 }));
 const selectedEl=$("move"+slot+"Selected");
 selectedEl.className=selected?"move-selected":"move-selected empty";
 selectedEl.innerHTML=selected?'<span>✓ '+selected+'</span><button type="button" class="move-change">変更</button>':'未選択';
 if(selected){
  selectedEl.querySelector(".move-change").addEventListener("click",function(){
   input.focus();
   input.select();
   renderMoveSlot(slot);
  });
 }
}

function renderItems(){
 const q=hira($("itemSearch").value.trim());
 const found=ITEMS.filter(v=>!q||hira(v).includes(q)).slice(0,8);
 $("itemCandidates").innerHTML=found.map(v=>'<button type="button" class="candidate" data-item="'+v+'">'+v+'</button>').join("");
 $("itemCandidates").querySelectorAll("[data-item]").forEach(btn=>btn.addEventListener("click",function(){
   if($("mega").checked)return;
   itemsSaved[$("itemSearch").dataset.id]=this.dataset.item;
   $("itemSelected").textContent="選択中："+this.dataset.item;
   $("itemSearch").value="";
   renderItems();
 }));
}
$("itemSearch").addEventListener("input",renderItems);

$("mega").addEventListener("change",function(){
 if(this.checked){
   itemsSaved[$("itemSearch").dataset.id]="";
 }
   updateItemLock();
});
render();
})();
</script>
</body>
</html>
